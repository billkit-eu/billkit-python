name: CI

# Unit tests only. The integration suite is gated on
# BILLKIT_INTEGRATION_BASE_URL and skips itself here: it needs a live BillKit
# API, which is exercised in the private platform repo before a release is cut.
# The response models are generated from the public OpenAPI document in that
# repo too; tests/test_generated_models.py skips here for want of it.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14']
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - name: Set up Python ${{ matrix.python }}
        run: uv python install ${{ matrix.python }}
      - name: Sync deps
        run: uv sync --all-extras --dev
      # Scoped to the code. A bare ``.`` also formats the Python blocks in
      # README.md and CHANGELOG.md, which are prose and stay as written.
      - name: Ruff
        run: |
          uv run ruff check src tests scripts
          uv run ruff format --check src tests scripts
      - name: Mypy
        run: uv run mypy src tests scripts
      - name: Sync mirror is up to date
        run: uv run python scripts/mirror_sync.py --check
      - name: Pytest
        run: uv run pytest -q
