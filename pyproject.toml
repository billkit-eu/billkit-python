[project]
name = "billkit-eu"
version = "0.2.2"
description = "Official Python SDK for BillKit: a Stripe-Billing-shape multi-tenant SaaS API on Mollie."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "BillKit", email = "sdk@billkit.eu" }]
keywords = ["billkit", "billing", "subscriptions", "mollie", "stripe", "saas", "eu"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
    "Framework :: AsyncIO",
    "Operating System :: OS Independent",
]
dependencies = [
    "httpx>=0.28.0",
]

[project.urls]
Homepage = "https://billkit.eu"
Documentation = "https://docs.billkit.eu"
Source = "https://github.com/billkit-eu/billkit-python"
Issues = "https://github.com/billkit-eu/billkit-python/issues"
Changelog = "https://github.com/billkit-eu/billkit-python/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.3.0",
    "respx>=0.22.0",
    "ruff>=0.16.2",
    "mypy>=2.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/billkit"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "PT"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["PT004"]

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.mypy]
strict = true
python_version = "3.11"
warn_unused_ignores = true
warn_redundant_casts = true
disallow_any_generics = true
disallow_untyped_defs = true
no_implicit_optional = true
check_untyped_defs = true
